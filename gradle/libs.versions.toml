[versions]
# Main plugins versions
spring-boot = "4.0.6"
spring-dependency-management = "1.1.7"
# Libraries versions
lombok = "1.18.46"
postgresql = "42.7.11"

[libraries]
# Spring Boot Starters
spring-boot-starter-data-jpa = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa", version.ref = "spring-boot" }
spring-boot-starter-security = { group = "org.springframework.boot", name = "spring-boot-starter-security", version.ref = "spring-boot" }
spring-boot-starter-webmvc = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc", version.ref = "spring-boot" }
# Spring Boot Dev Tools
spring-boot-devtools = { group = "org.springframework.boot", name = "spring-boot-devtools", version.ref = "spring-boot" }
# Libraries
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "postgresql" }
#Spring Boot test libraries
spring-boot-starter-data-jpa-test = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa-test", version.ref = "spring-boot" }
spring-boot-starter-security-test = { group = "org.springframework.boot", name = "spring-boot-starter-security-test", version.ref = "spring-boot" }
spring-boot-starter-webmvc-test = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc-test", version.ref = "spring-boot" }

[plugins]
# Main plugins
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

[bundles]